<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Console</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #4c8dff;
    --accent-text: #ffffff;
    --error: #ff6b6b;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --border: #d8dce3;
      --text: #1b1f27; --muted: #5b6472; --error: #b3261e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  fieldset {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); padding: 1rem 1.15rem 1.25rem; margin: 0 0 1.25rem;
  }
  legend { padding: 0 .4rem; font-weight: 600; font-size: .9rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: .75rem 0 .3rem; }
  select, textarea, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: .55rem .7rem; width: 100%;
  }
  textarea { resize: vertical; min-height: 90px; }
  select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; }
  .row > div { flex: 1 1 140px; }
  button {
    background: var(--accent); color: var(--accent-text); border-color: transparent;
    font-weight: 600; cursor: pointer; width: auto; padding: .6rem 1.2rem; margin-top: 1rem;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .examples { margin-top: .9rem; display: flex; flex-wrap: wrap; gap: .4rem; }
  .examples button {
    margin: 0; padding: .3rem .6rem; font-size: .8rem; font-weight: 500;
    background: transparent; color: var(--muted); border-color: var(--border);
  }
  #answer {
    white-space: pre-wrap; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); padding: 1rem 1.15rem;
  }
  #answer:empty { display: none; }
  .status { font-size: .85rem; color: var(--muted); margin-top: .6rem; }
  .status[data-kind="error"] { color: var(--error); font-weight: 600; }
  ol.cites { margin: .9rem 0 0; padding-left: 1.3rem; font-size: .85rem; color: var(--muted); }
  ol.cites li { margin-bottom: .3rem; word-break: break-all; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<main>
  <h1>RAG Console</h1>
  <p class="sub">
    Ask questions about Meridian Retail Bank's product terms, fees, payment
    limits, lending criteria and customer policies. Answers are generated by
    Amazon Bedrock from retrieved passages, with sources listed below.
  </p>

  <form id="askForm" autocomplete="off">
    <fieldset>
      <legend>Ask a question</legend>
      <label for="question">Question</label>
      <textarea id="question" name="question" required maxlength="2000"
                placeholder="How does the ingestion pipeline chunk documents?"></textarea>
      <div class="row">
        <div>
          <label for="k">Passages to retrieve</label>
          <select id="k" name="k">
            <option>3</option><option selected>5</option><option>8</option><option>12</option>
          </select>
        </div>
        <div>
          <label for="mode">Retrieval mode</label>
          <select id="mode" name="mode">
            <option value="hybrid" selected>Hybrid (vector + keyword)</option>
            <option value="vector">Vector only</option>
          </select>
        </div>
      </div>
      <button type="submit" id="askBtn">Ask</button>

      <div class="examples" role="group" aria-label="Example questions">
        <button type="button" class="example">What is my liability if I report an unauthorised card transaction after 5 days?</button>
        <button type="button" class="example">What is the UPI limit for paying a hospital?</button>
        <button type="button" class="example">What interest rate applies to a senior citizen 3 year fixed deposit?</button>
        <button type="button" class="example">When is a cheque subject to positive pay?</button>
        <button type="button" class="example">What is the FOIR ceiling for a personal loan?</button>
        <button type="button" class="example">How long do I have to escalate to the Ombudsman?</button>
      </div>

      <p class="status" id="askStatus" role="status" aria-live="polite"></p>
    </fieldset>
  </form>

  <h2 class="sr-only">Answer</h2>
  <div id="answer" role="region" aria-live="polite" aria-label="Answer"></div>
  <ol class="cites" id="cites"></ol>
</main>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  function setStatus(message, kind) {
    const el = $("askStatus");
    el.textContent = message;
    if (kind) { el.dataset.kind = kind; } else { delete el.dataset.kind; }
  }

  for (const btn of document.querySelectorAll("button.example")) {
    btn.addEventListener("click", () => {
      $("question").value = btn.textContent.trim();
      $("question").focus();
    });
  }

  $("askForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = $("question").value.trim();
    if (!question) { return; }

    $("askBtn").disabled = true;
    setStatus("Retrieving passages and generating an answer\u2026");
    $("answer").textContent = "";
    $("cites").replaceChildren();

    try {
      const res = await fetch("/query", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          question: question,
          k: Number($("k").value),
          mode: $("mode").value
        })
      });

      let payload = null;
      try { payload = await res.json(); } catch (_) { /* non-JSON error page */ }

      if (!res.ok) {
        const detail = payload && payload.detail ? JSON.stringify(payload.detail) : res.statusText;
        throw new Error("Request failed (" + res.status + "): " + detail);
      }

      $("answer").textContent = payload.answer;
      for (const c of (payload.citations || [])) {
        const li = document.createElement("li");
        li.textContent = "[" + c.marker + "] " + (c.source || c.doc_id) + "  score " + c.score;
        $("cites").appendChild(li);
      }
      const n = (payload.citations || []).length;
      setStatus("Answered by " + payload.model_id + " using " + n + " passage(s).");
    } catch (err) {
      setStatus(err.message, "error");
    } finally {
      $("askBtn").disabled = false;
    }
  });
})();
</script>
</body>
</html>
