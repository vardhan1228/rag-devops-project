name: deploy

# ===========================================================================
#  Three jobs, in order:
#
#      checks  ──▶  deploy  ──▶  smoke
#     (no AWS)      (build + apply)   (curl the live URL)
#
#  checks : ruff on the Python, fmt + validate on the Terraform. No AWS
#           credentials, so a typo fails in under a minute for free.
#  deploy : builds BOTH images, applies the Terraform, seeds the corpus.
#  smoke  : proves the deployed stack can actually answer a question.
#
#  Pull requests run checks only. Pushes to main also deploy.
# ---------------------------------------------------------------------------
#  ONE-TIME SETUP (do this by hand before the first run)
#
#  1. Create the Terraform state bucket:
#
#       aws s3api create-bucket --bucket my-rag-tfstate --region us-east-1
#       aws s3api put-bucket-versioning --bucket my-rag-tfstate \
#         --versioning-configuration Status=Enabled
#
#  2. In the repo: Settings ▸ Secrets and variables ▸ Actions
#
#       Secrets    AWS_ACCESS_KEY_ID
#                  AWS_SECRET_ACCESS_KEY
#                  TF_STATE_BUCKET   = my-rag-tfstate
#
#  3. Enable the Bedrock models in the console: Titan Embed Text v2 and
#     Nova Lite, in us-east-1.
# ===========================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.5
  TF_IN_AUTOMATION: "true"

# Two deploys must never race for the same state lock.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  #  1. CHECKS -- no AWS account needed
  # =========================================================================
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Lint the Python
        run: |
          pip install ruff==0.8.4
          ruff check app

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check the Terraform
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  # =========================================================================
  #  2. DEPLOY -- build both images, then apply
  # =========================================================================
  deploy:
    name: deploy
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      # The commit SHA is the image tag, so the running code is never ambiguous.
      TF_VAR_image_tag: ${{ github.sha }}
    outputs:
      web_url: ${{ steps.info.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check TF_STATE_BUCKET is set
        run: |
          if [ -z "${{ secrets.TF_STATE_BUCKET }}" ]; then
            echo "::error::Create an S3 bucket for Terraform state, then set the TF_STATE_BUCKET repository secret. See the comments at the top of this file."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      # --------------------------------------------------------------------
      # Step 1: the registries must exist before we can push to them, and the
      # ECS task and Lambda both reference an image tag inside them. So apply
      # just the two repositories first.
      # --------------------------------------------------------------------
      - name: Create the two ECR repositories
        id: ecr
        run: |
          set -euo pipefail
          terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m \
            -target=aws_ecr_repository.api -target=aws_ecr_repository.ingest
          echo "api=$(terraform -chdir=terraform output -raw api_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ingest=$(terraform -chdir=terraform output -raw ingest_repository_url)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # Step 2: one image per service, each built from the Dockerfile that
      # sits next to its own code. `context: .` is the repo root, because both
      # images COPY app/ and requirements.txt from there.
      # --------------------------------------------------------------------
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the ingest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/ingestion/Dockerfile
          push: true
          # Lambda requires a plain single-image manifest.
          provenance: false
          tags: ${{ steps.ecr.outputs.ingest }}:${{ github.sha }}
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,scope=ingest,mode=max

      # --------------------------------------------------------------------
      # Step 3: everything else, now that both tags exist.
      # The first run creates an OpenSearch domain, which takes 15-25 minutes.
      # --------------------------------------------------------------------
      - name: terraform apply
        timeout-minutes: 45
        run: terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Wait for the API to come up
        timeout-minutes: 20
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=terraform output -raw ecs_cluster_name)" \
            --services "$(terraform -chdir=terraform output -raw ecs_service_name)"

      # --------------------------------------------------------------------
      # Step 4: fill the search index.
      # Uploading fires the S3 event per file, but that cannot remove passages
      # for files you deleted. So sync first, then one reindex call that drops
      # the index and rebuilds it from whatever is in the bucket.
      # --------------------------------------------------------------------
      - name: Upload the sample documents
        run: |
          set -euo pipefail
          BUCKET=$(terraform -chdir=terraform output -raw documents_bucket)
          aws s3 sync sample-data/ "s3://${BUCKET}/uploads/" --size-only --delete
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      - name: Rebuild the search index
        timeout-minutes: 10
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$(terraform -chdir=terraform output -raw ingest_lambda_name)" \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"reindex\":true,\"bucket\":\"${BUCKET}\",\"prefix\":\"uploads/\"}" \
            --cli-read-timeout 600 \
            result.json >/dev/null
          cat result.json | jq .

          # A Lambda error comes back as an errorMessage key, not a bad exit code.
          if jq -e 'has("errorMessage")' result.json >/dev/null; then
            echo "::error::Ingest failed: $(jq -r .errorMessage result.json)"
            exit 1
          fi
          if [ "$(jq -r '.indexed // 0' result.json)" -lt 1 ]; then
            echo "::error::No passages were indexed"
            exit 1
          fi
          echo "Indexed $(jq -r .indexed result.json) passages."

      - name: Show where it is
        id: info
        run: |
          set -euo pipefail
          WEB_URL=$(terraform -chdir=terraform output -raw web_url)
          echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice title=RAG console::${WEB_URL}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Deployed
          | | |
          |---|---|
          | Web UI | [${WEB_URL}](${WEB_URL}) |
          | Image tag | \`${{ github.sha }}\` |
          | Documents | \`s3://${BUCKET}/uploads/\` |
          EOF

  # =========================================================================
  #  3. SMOKE -- plain HTTP against the live stack, no AWS access needed
  # =========================================================================
  smoke:
    name: smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      WEB_URL: ${{ needs.deploy.outputs.web_url }}
    steps:
      - name: Is it alive?
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$WEB_URL/health" || echo 000)
            [ "$code" = "200" ] && { echo "Healthy after $i attempt(s)."; exit 0; }
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::/health never returned 200"
          exit 1

      - name: Is the index there?
        run: |
          for i in $(seq 1 30); do
            curl -s -m 15 "$WEB_URL/ready" | grep -q '"index_exists":true' && { echo "Index present."; exit 0; }
            echo "attempt $i: index not ready"
            sleep 10
          done
          echo "::error::Index never appeared. Check the ingest Lambda logs and its DLQ."
          exit 1

      # The real test: retrieval found passages AND the model answered from
      # them. Asserting on citations rather than wording keeps this stable
      # across model versions.
      - name: Can it answer a question?
        run: |
          set -euo pipefail
          body=$(curl -s -m 90 -X POST -H 'content-type: application/json' \
            -d '{"question":"What is the customer liability for an unauthorised card transaction reported within three working days?","k":5}' \
            "$WEB_URL/query")
          echo "$body" | jq .

          cites=$(echo "$body" | jq '.citations | length')
          if [ "$cites" -lt 1 ]; then
            echo "::error::Answer had no citations, so retrieval returned nothing"
            exit 1
          fi
          echo "Answered with ${cites} citation(s)."
          echo "::notice title=RAG console::${WEB_URL}"
