name: deploy

# Deployment order matters here. Terraform owns the ECR repository, but ECS and
# Lambda cannot start until an image exists inside it. So the apply is split:
#
#   1. lint / validate        - fail fast before touching AWS
#   2. bootstrap              - verify credentials, create the state bucket
#   3. plan (PRs only)        - review-only, no changes applied
#   4. apply-registry         - create just the ECR repository
#   5. build                  - build and push the image, tagged with the SHA
#   6. apply                  - full apply, wiring workloads to that image
#   7. smoke                  - prove the deployed stack actually answers
#
# The build host EC2 instance is disabled in CI (builder_enabled=false) because
# GitHub runners already have Docker.
#
# Credentials: long-lived IAM user access keys held as repository secrets.
#   Secrets   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables AWS_ACCOUNT_ID (optional), TF_STATE_BUCKET (optional override)
#
# AWS_ACCOUNT_ID is not a secret; it is asserted against the caller identity so
# a swapped key cannot quietly deploy into a different account. Because these
# keys never expire on their own, rotate them on a schedule.
#
# Every job that runs `terraform init` creates the state bucket first, so the
# backend always exists even when a single job is re-run on its own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.5
  PYTHON_VERSION: "3.12"
  TF_IN_AUTOMATION: "true"
  # Base name for the Terraform state bucket. The AWS account id is appended at
  # runtime. S3 bucket names are globally unique across every AWS account, so a
  # bare name created under one account cannot be created or read from another:
  # HeadBucket answers 403, not 404, which looks like a permissions fault.
  # Appending the account id keeps the name unique and survives account changes.
  TF_STATE_BUCKET_BASE: ${{ vars.TF_STATE_BUCKET || 'dev-genai-cloudrag' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  TF_ENVIRONMENT: ${{ inputs.environment || 'dev' }}

# Never let two deployments race for the same state lock.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- quality
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.4

      - name: Lint
        run: ruff check app

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      # No backend or credentials needed just to check syntax and types.
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  # --------------------------------------------------------------- bootstrap
  bootstrap:
    name: credentials & state bucket
    needs: [lint, validate]
    runs-on: ubuntu-latest
    steps:
      # Secrets are passed through env, never interpolated into the shell, so a
      # value containing shell metacharacters cannot be executed.
      - name: Check the credentials are configured
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${KEY_ID}" ] || [ -z "${SECRET}" ]; then
            echo "::error::Set the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Fails in seconds if the keys are wrong, rather than midway through a
      # 20-minute apply. Also refuses to run against an unexpected account.
      - name: Verify the caller identity
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          echo "Authenticated to account ${ACTUAL} as $(aws sts get-caller-identity --query Arn --output text)"
          if [ -n "${AWS_ACCOUNT_ID}" ] && [ "${ACTUAL}" != "${AWS_ACCOUNT_ID}" ]; then
            echo "::error::Credentials resolve to ${ACTUAL} but AWS_ACCOUNT_ID is ${AWS_ACCOUNT_ID}. Refusing to deploy."
            exit 1
          fi

      # State holds secrets in plaintext, so versioning, encryption, a public
      # access block and TLS-only access are requirements, not extras. Re-run
      # safe: settings are reapplied even when the bucket already exists.
      - name: Create the Terraform state bucket
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET_BASE}-${ACCOUNT}"
          echo "State bucket: ${BUCKET}"

          # 404, 403 and everything else mean different things and must not be
          # collapsed. Treating 403 as "absent" leads to a create attempt and an
          # opaque BucketAlreadyExists, hiding the real cause.
          if probe=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1); then
            echo "Bucket already exists and is accessible."
          elif printf '%s' "$probe" | grep -q '404'; then
            echo "Creating ${BUCKET} in ${AWS_REGION}"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
          elif printf '%s' "$probe" | grep -q '403'; then
            echo "::error::Bucket ${BUCKET} exists but this account cannot access it. S3 names are global; set the TF_STATE_BUCKET variable to a different base name."
            exit 1
          else
            echo "::error::Could not check bucket ${BUCKET}: ${probe}"
            exit 1
          fi

          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'

          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{
              \"Sid\": \"DenyInsecureTransport\",
              \"Effect\": \"Deny\",
              \"Principal\": \"*\",
              \"Action\": \"s3:*\",
              \"Resource\": [
                \"arn:aws:s3:::$BUCKET\",
                \"arn:aws:s3:::$BUCKET/*\"
              ],
              \"Condition\": { \"Bool\": { \"aws:SecureTransport\": \"false\" } }
            }]
          }"

  # ------------------------------------------------------ pull requests only
  plan:
    name: plan (review only)
    needs: bootstrap
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Resolves the same account-scoped name the bootstrap job created, and
      # exports it so the init step below uses it. Creating it here too keeps
      # this job correct when it is re-run on its own.
      - name: Resolve and ensure the state bucket
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET_BASE}-${ACCOUNT}"
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "State bucket: ${BUCKET}"

          if probe=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1); then
            echo "Bucket is present."
          elif printf '%s' "$probe" | grep -q '404'; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "::error::Cannot access state bucket ${BUCKET}: ${probe}"
            exit 1
          fi

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      # Plans against whatever image is currently deployed, so an unpushed tag
      # cannot make the diff look artificially large.
      - name: Plan
        run: |
          terraform -chdir=terraform plan -input=false -lock-timeout=5m -no-color \
            -var="environment=$TF_ENVIRONMENT" \
            -var="builder_enabled=false" \
            | tee plan.txt

      - name: Summarize the plan
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || tail -20 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------- stage 1: the registry
  apply-registry:
    name: create ECR repository
    needs: bootstrap
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.ecr.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Resolves the same account-scoped name the bootstrap job created, and
      # exports it so the init step below uses it. Creating it here too keeps
      # this job correct when it is re-run on its own.
      - name: Resolve and ensure the state bucket
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET_BASE}-${ACCOUNT}"
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "State bucket: ${BUCKET}"

          if probe=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1); then
            echo "Bucket is present."
          elif printf '%s' "$probe" | grep -q '404'; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "::error::Cannot access state bucket ${BUCKET}: ${probe}"
            exit 1
          fi

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      # -target builds only the dependency closure, which is exactly what is
      # wanted here. The full apply in a later stage fills in everything else.
      - name: Apply the repository only
        run: |
          terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m \
            -var="environment=$TF_ENVIRONMENT" \
            -var="builder_enabled=false" \
            -target=aws_ecr_repository.api

      - name: Export the repository URL
        id: ecr
        run: |
          URL=$(terraform -chdir=terraform output -raw ecr_repository_url)
          echo "repository=$URL" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------ stage 2: the image
  build:
    name: build & push image
    needs: apply-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # The repository uses immutable tags, so the commit SHA is the tag.
      # provenance=false keeps the manifest in the single-image format that
      # Lambda requires.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ needs.apply-registry.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------- stage 3: the workloads
  apply:
    name: terraform apply
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate prod.
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      web_url: ${{ steps.outputs.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Resolves the same account-scoped name the bootstrap job created, and
      # exports it so the init step below uses it. Creating it here too keeps
      # this job correct when it is re-run on its own.
      - name: Resolve and ensure the state bucket
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET_BASE}-${ACCOUNT}"
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "State bucket: ${BUCKET}"

          if probe=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1); then
            echo "Bucket is present."
          elif printf '%s' "$probe" | grep -q '404'; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api wait bucket-exists --bucket "$BUCKET"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          else
            echo "::error::Cannot access state bucket ${BUCKET}: ${probe}"
            exit 1
          fi

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Plan
        run: |
          terraform -chdir=terraform plan -input=false -lock-timeout=5m \
            -var="environment=$TF_ENVIRONMENT" \
            -var="image_tag=${{ github.sha }}" \
            -var="builder_enabled=false" \
            -out=tfplan

      # A first-run apply creates an OpenSearch domain, which takes 15-25 min.
      - name: Apply
        timeout-minutes: 45
        run: terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m tfplan

      - name: Wait for the service to stabilize
        timeout-minutes: 20
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=terraform output -raw ecs_cluster_name)" \
            --services "$(terraform -chdir=terraform output -raw ecs_service_name)"

      # Uploading under uploads/ fires the S3 notification per object, but that
      # cannot remove passages for documents no longer in the bucket. So sync
      # first, then run one reindex invocation that drops the index and rebuilds
      # it from the bucket. One invocation also avoids the concurrent index
      # creation contention that per-object triggers cause.
      ####################################################
      # - name: Upload the sample corpus
      #   run: |
      #     set -euo pipefail
      #     BUCKET=$(terraform -chdir=terraform output -raw documents_bucket)
      #     aws s3 sync sample-data/ "s3://${BUCKET}/uploads/" --size-only --delete
      #     echo "Corpus objects now in the bucket:"
      #     aws s3 ls "s3://${BUCKET}/uploads/"
      #     echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      # - name: Rebuild the search index from the bucket
      #   timeout-minutes: 10
